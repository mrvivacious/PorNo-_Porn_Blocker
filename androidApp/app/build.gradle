plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'io.sentry.android.gradle' version '6.0.0'
}

android {
    namespace 'us.mrvivacio.porno'
    compileSdkVersion 36

    defaultConfig {
        applicationId "us.mrvivacio.porno"
        minSdkVersion 21
        targetSdkVersion 36

        versionCode 36013 // minSDK + 0 + major version + minor version
        versionName "1.31"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true // false for dev. true for release builds.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Android X core
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Preference library for android 13+ fix
    implementation "androidx.preference:preference-ktx:1.2.1"

    // Sentry SDK (Actually captures the crashes)
    implementation 'io.sentry:sentry-android:8.58.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

sentry {
    org = "porno-android"
    projectName = "android"
    includeSourceContext = true
}
